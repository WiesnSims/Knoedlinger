# The co-op relay (docs/DECISIONS.md, M6; Berghittn's relay): one Durable Object per room. No public
# route of its own; players reach it only through the Pages Function on knoedlinger.pages.dev/api/room/<code>.
name = "knoedlinger-relay"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = false
preview_urls = false

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
